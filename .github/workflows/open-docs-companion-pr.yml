name: Open docs companion PR

on:
  push:
    branches:
      - cursor/p1-package-docs-sot-pr-250d
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Create pull request if missing
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const head = 'cursor/p1-package-docs-sot-703a';
            const base = 'main';
            const title = 'docs: align package SoT, bind mounts, planned managed, live profiles';
            const body = [
              'Closes #14',
              '',
              'Companion to [recipes#11](https://github.com/fyrst-dev/recipes/issues/11) and [recipes#26](https://github.com/fyrst-dev/recipes/pull/26).',
              '',
              'Keep Packagist package docs aligned with the recipes P1 overlay:',
              '',
              '- Identity SoT: required `SHOPWARE_SHOP_ID` + `SHOPWARE_DEPLOY_ENV`; optional `SHOPWARE_DATA_BASE` / expanded vars',
              '- Compose interpolates SoT vars directly; VPS uploads are **bind mounts**',
              '- Managed host is **planned / not implemented** (`DEPLOY_TARGET=managed` is not a supported switch)',
              '- Live recommendation: uncomment `COMPOSE_PROFILES=redis,worker,scheduler`',
              '- Roadmap links to recipes P0–P2 epics',
              '',
              'Updates `README.md`, `CREATE.md`, and `tests/package.test.php`.',
            ].join('\n');
            const existing = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${head}`,
              base,
            });
            if (existing.data.length) {
              core.info(`PR already exists: ${existing.data[0].html_url}`);
              return;
            }
            const created = await github.rest.pulls.create({
              owner,
              repo,
              title,
              head,
              base,
              body,
            });
            core.info(`Created PR: ${created.data.html_url}`);
