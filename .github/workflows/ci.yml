name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Overlay apply
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
          tools: composer

      - name: PHP syntax
        run: find bin src tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Validate composer.json
        run: composer validate --no-check-publish

      - name: Apply CLI tests
        run: php tests/apply.test.php

      - name: Create --dry-run
        run: php tests/create.test.php

      - name: Composer require applies overlay
        run: php tests/composer-plugin.test.php
