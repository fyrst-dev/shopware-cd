# VPS-only Compose overlay. CI / fyrst-cli shopware deploy release adds this
# file so the host never rebuilds the image (assets were compiled in CI).
#
# Invoke from the shop root (same --env-file stack as fyrst-cli; omit a flag if missing):
#   docker compose --env-file .env --env-file .env.local --env-file .env.prod -f deploy/compose.yaml -f deploy/compose.prod.yaml -f deploy/compose.vps.yaml pull
#   docker compose --env-file .env --env-file .env.local --env-file .env.prod -f deploy/compose.yaml -f deploy/compose.prod.yaml -f deploy/compose.vps.yaml up -d --no-build
#
# pull_policy default is always — correct after CI pushes IMAGE:IMAGE_TAG to a
# registry. Same-host tag-and-load (local E2E / air-gap) never pushed that tag,
# so pull fails. Override without a second compose file:
#   PULL_POLICY=never
#   SKIP_PULL=1          # also skip `docker compose pull` in deploy release
# Leave unset on a real VPS that should pull from the registry.

services:
    web:
        image: ${IMAGE:?Set IMAGE}:${IMAGE_TAG:?Set IMAGE_TAG to the git SHA}
        pull_policy: ${PULL_POLICY:-always}

    setup:
        image: ${IMAGE}:${IMAGE_TAG}
        pull_policy: ${PULL_POLICY:-always}

    init-perm:
        image: ${IMAGE}:${IMAGE_TAG}
        pull_policy: ${PULL_POLICY:-always}

    worker:
        image: ${IMAGE}:${IMAGE_TAG}
        pull_policy: ${PULL_POLICY:-always}

    scheduler:
        image: ${IMAGE}:${IMAGE_TAG}
        pull_policy: ${PULL_POLICY:-always}
